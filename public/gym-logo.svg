<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1d22"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="50%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container / Card Background -->
  <rect width="512" height="512" rx="40" fill="#09090b"/>

  <!-- Main Circular Emblem Outer Border -->
  <circle cx="256" cy="256" r="225" fill="url(#bgGlow)" stroke="#ef4444" stroke-width="8"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Splatter / Speckle Details in Background -->
  <g fill="#3f3f46" opacity="0.35">
    <circle cx="160" cy="140" r="5"/>
    <circle cx="175" cy="125" r="3"/>
    <circle cx="150" cy="160" r="4"/>
    <circle cx="350" cy="140" r="6"/>
    <circle cx="335" cy="120" r="3"/>
    <circle cx="365" cy="160" r="4"/>
    <circle cx="130" cy="180" r="3"/>
    <circle cx="380" cy="180" r="3"/>
  </g>

  <!-- Barbell Bar -->
  <rect x="25" y="270" width="462" height="14" rx="7" fill="url(#metalGrad)" stroke="#18181b" stroke-width="2"/>

  <!-- Left Weight Plates -->
  <g filter="url(#shadow)">
    <!-- Outer Plate -->
    <rect x="35" y="220" width="22" height="114" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
    <rect x="40" y="226" width="12" height="102" rx="3" fill="#27272a"/>
    <!-- Inner Plate -->
    <rect x="62" y="232" width="20" height="90" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
    <rect x="66" y="238" width="12" height="78" rx="3" fill="#27272a"/>
    <!-- Collar -->
    <rect x="85" y="258" width="16" height="38" rx="3" fill="url(#metalGrad)"/>
    <rect x="103" y="263" width="12" height="28" rx="2" fill="#ef4444"/>
  </g>

  <!-- Right Weight Plates -->
  <g filter="url(#shadow)">
    <!-- Outer Plate -->
    <rect x="455" y="220" width="22" height="114" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
    <rect x="460" y="226" width="12" height="102" rx="3" fill="#27272a"/>
    <!-- Inner Plate -->
    <rect x="430" y="232" width="20" height="90" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
    <rect x="434" y="238" width="12" height="78" rx="3" fill="#27272a"/>
    <!-- Collar -->
    <rect x="411" y="258" width="16" height="38" rx="3" fill="url(#metalGrad)"/>
    <rect x="397" y="263" width="12" height="28" rx="2" fill="#ef4444"/>
  </g>

  <!-- Muscular Figure Body / Silhouette -->
  <g filter="url(#shadow)">
    <!-- Hair / Beard Head -->
    <path d="M 230 85 C 230 60, 282 60, 282 85 C 282 100, 288 120, 280 142 C 270 160, 242 160, 232 142 C 224 120, 230 100, 230 85 Z" fill="#09090b" stroke="#3f3f46" stroke-width="3"/>
    <!-- Face / Beard Detailing -->
    <path d="M 242 90 C 248 85, 264 85, 270 90 L 274 108 C 268 125, 244 125, 238 108 Z" fill="#e4e4e7"/>
    <!-- Beard & Mustache -->
    <path d="M 238 102 C 248 106, 264 106, 274 102 C 278 125, 268 142, 256 145 C 244 142, 234 125, 238 102 Z" fill="#09090b"/>
    <path d="M 244 110 C 252 114, 260 114, 268 110 C 265 118, 247 118, 244 110 Z" fill="#e4e4e7"/>

    <!-- Traps and Neck -->
    <path d="M 220 120 Q 256 100 292 120 L 315 145 Q 256 160 197 145 Z" fill="#d4d4d8" stroke="#18181b" stroke-width="2"/>

    <!-- Massive Shoulders & Chest (Pecs & Abs) -->
    <path d="M 175 165 C 150 170, 135 195, 140 225 C 150 250, 180 255, 195 230 L 205 180 Z" fill="#e4e4e7" stroke="#27272a" stroke-width="3"/>
    <path d="M 337 165 C 362 170, 377 195, 372 225 C 362 250, 332 255, 317 230 L 307 180 Z" fill="#e4e4e7" stroke="#27272a" stroke-width="3"/>

    <!-- Upper Chest (Pectorals) -->
    <path d="M 195 160 C 220 162, 250 175, 256 200 C 250 215, 200 220, 190 190 Z" fill="#f4f4f5" stroke="#27272a" stroke-width="2"/>
    <path d="M 317 160 C 292 162, 262 175, 256 200 C 262 215, 312 220, 322 190 Z" fill="#f4f4f5" stroke="#27272a" stroke-width="2"/>

    <!-- Abs Grid -->
    <path d="M 225 205 C 240 205, 253 208, 256 220 C 250 230, 225 230, 220 220 Z" fill="#d4d4d8"/>
    <path d="M 287 205 C 272 205, 259 208, 256 220 C 262 230, 287 230, 292 220 Z" fill="#d4d4d8"/>
    <path d="M 228 232 C 242 232, 253 234, 256 245 C 250 255, 228 255, 224 245 Z" fill="#a1a1aa"/>
    <path d="M 284 232 C 270 232, 259 234, 256 245 C 262 255, 284 255, 288 245 Z" fill="#a1a1aa"/>

    <!-- Arms Holding Barbell -->
    <!-- Left Forearm & Hand with Red Wristband -->
    <path d="M 145 230 L 170 270 L 195 270 L 175 220 Z" fill="#d4d4d8" stroke="#18181b" stroke-width="2"/>
    <rect x="155" y="255" width="26" height="18" rx="4" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>

    <!-- Right Forearm & Hand with Red Wristband -->
    <path d="M 367 230 L 342 270 L 317 270 L 337 220 Z" fill="#d4d4d8" stroke="#18181b" stroke-width="2"/>
    <rect x="331" y="255" width="26" height="18" rx="4" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
  </g>

  <!-- Center JLAB Shield / Banner -->
  <g filter="url(#shadow)">
    <!-- Outer Shield Arc Base -->
    <path d="M 120 285 Q 256 260 392 285 L 380 375 Q 256 395 132 375 Z" fill="#09090b" stroke="#ef4444" stroke-width="6"/>
    <path d="M 126 291 Q 256 268 386 291 L 376 369 Q 256 387 136 369 Z" fill="#18181b"/>

    <!-- "JLAB" Main Bold Title Text -->
    <text x="256" y="348" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="78" font-weight="900" fill="#ffffff" letter-spacing="6" stroke="#000" stroke-width="3">
      JLAB
    </text>
  </g>

  <!-- Bottom Red Arc Banner for "FITNESS" -->
  <g filter="url(#shadow)">
    <!-- Red Banner Ribbon -->
    <path d="M 145 370 Q 256 395 367 370 Q 385 435 360 455 Q 256 480 152 455 Q 127 435 145 370 Z" fill="url(#redGrad)" stroke="#18181b" stroke-width="4"/>

    <!-- Three White Stars -->
    <g fill="#ffffff" filter="url(#shadow)">
      <!-- Left Star -->
      <polygon points="215,392 218,400 226,400 220,405 222,413 215,408 208,413 210,405 204,400 212,400"/>
      <!-- Center Star (Larger) -->
      <polygon points="256,388 260,397 270,397 262,403 265,412 256,406 247,412 250,403 242,397 252,397"/>
      <!-- Right Star -->
      <polygon points="297,392 300,400 308,400 302,405 304,413 297,408 290,413 292,405 286,400 294,400"/>
    </g>

    <!-- "FITNESS" Subtitle Text -->
    <text x="256" y="446" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="8" stroke="#000000" stroke-width="2">
      FITNESS
    </text>
  </g>
</svg>
